name: Android Web Emulator (Ubuntu Loop) - by Redwanul Haque
# Suggested filename: android-web-emulator-slow.yml

on:
  workflow_dispatch:
    inputs:
      loops:
        description: "🔄 Loop Counter (leave blank, auto-managed by the system)"
        required: false
        default: ""

concurrency:
  group: android-web-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  android-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # ───────────────────────────────────────────────
      # Step 1: Validate GitHub Token
      # ───────────────────────────────────────────────
      - name: 🔑 Validate GitHub Token
        id: validate
        run: |
          token="${{ secrets.GH_PAT }}"
          if [ -z "$token" ] || [ ${#token} -lt 10 ]; then
            echo "❌ GH_PAT secret is not set! Go to repo Settings > Secrets > Actions and add GH_PAT."
            exit 1
          fi
          echo "✅ GH_PAT secret is configured (${#token} chars)."

      # ───────────────────────────────────────────────
      # Step 2: Start Android Web Emulator Container
      # ───────────────────────────────────────────────
      - name: 📱 Start Android Web Emulator Container
        id: android-start
        run: |
          echo "📦 Pulling & starting budtmo/docker-android:emulator_11.0 container on port 6080..."
          docker run -d \
            --name android-web \
            --privileged \
            --shm-size=2gb \
            -p 6080:6080 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e WEB_VNC=true \
            budtmo/docker-android:emulator_11.0

          echo "⏳ Waiting for Android Web server on port 6080 to respond..."
          ready=false
          for i in {1..40}; do
            if curl -s http://localhost:6080 > /dev/null 2>&1; then
              ready=true
              echo "✅ Android Web Emulator is active and responding on port 6080!"
              break
            fi
            echo "Attempt ${i}: waiting for Android Web server..."
            sleep 4
          done

          if [ "$(docker inspect -f '{{.State.Running}}' android-web 2>/dev/null || true)" == "true" ]; then
            echo "✅ Android Web container is running!"
          else
            echo "❌ Android Web container failed to start. Container logs:"
            docker logs android-web || true
            exit 1
          fi

      # ───────────────────────────────────────────────
      # Step 3: Install & Start Cloudflare Tunnel
      # ───────────────────────────────────────────────
      - name: 🌐 Setup Cloudflare Tunnel
        id: cloudflare-tunnel
        run: |
          echo "⬇️ Downloading & installing cloudflared..."
          curl -L -s --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

          echo "🚀 Launching Cloudflare Tunnel for http://localhost:6080 ..."
          rm -f /tmp/cloudflared.log
          cloudflared tunnel --url http://localhost:6080 --logfile /tmp/cloudflared.log > /dev/null 2>&1 &

          echo "⏳ Waiting for Cloudflare Tunnel URL..."
          CF_URL=""
          for i in {1..30}; do
            sleep 2
            if [ -f /tmp/cloudflared.log ]; then
              CF_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -n 1 || true)
              if [ -n "$CF_URL" ]; then
                echo "✅ Found Cloudflare URL on attempt $i: $CF_URL"
                break
              fi
            fi
          done

          if [ -n "$CF_URL" ]; then
            echo "⏳ Waiting 10 seconds for Cloudflare DNS propagation..."
            sleep 10
            echo ""
            echo "================================================================="
            echo "📱 ANDROID WEB EMULATOR URL: $CF_URL"
            echo "================================================================="
            echo ""
            echo "ANDROID_URL=$CF_URL" >> $GITHUB_ENV
          else
            echo "⚠️ Cloudflare Tunnel URL could not be extracted within time limit."
            if [ -f /tmp/cloudflared.log ]; then
              echo "--- Cloudflare Log Content ---"
              cat /tmp/cloudflared.log || true
            fi
            echo "ANDROID_URL=Not Available" >> $GITHUB_ENV
          fi

      # ───────────────────────────────────────────────
      # Step 4: Send Details to Telegram
      # ───────────────────────────────────────────────
      - name: 📲 Send Details to Telegram
        run: |
          botToken="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          chatId="${{ secrets.TELEGRAM_CHAT_ID }}"

          if [ -z "$botToken" ] || [ -z "$chatId" ]; then
            echo "⚠️ Telegram secrets not set. Skipping notification."
          else
            message="📱 <b>Android Web Emulator Ready!</b>"$'\n'
            message+="━━━━━━━━━━━━━━━━━━━━"$'\n'
            message+="🔗 Web Phone URL: <code>${ANDROID_URL}</code>"$'\n'
            message+="⚡ Engine: <code>Android 11.0 Web UI</code>"$'\n'
            message+="━━━━━━━━━━━━━━━━━━━━"$'\n'
            message+="⏱️ Uptime: ~5h 50m"$'\n'
            message+="🔁 Run: #${{ github.run_number }}"$'\n'
            message+="━━━━━━━━━━━━━━━━━━━━"$'\n'
            message+="⚡ <i>Powered by Redwanul Haque</i>"

            payload=$(jq -n \
              --arg chat_id "$chatId" \
              --arg text "$message" \
              --arg parse_mode "HTML" \
              '{chat_id: $chat_id, text: $text, parse_mode: $parse_mode}')

            curl -s -X POST "https://api.telegram.org/bot${botToken}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$payload" > /dev/null || true
            echo "✅ Telegram notification sent!"
          fi

      # ───────────────────────────────────────────────
      # Step 5: Print Details & Keep Alive
      # ───────────────────────────────────────────────
      - name: 📢 Print Details & Keep Alive
        run: |
          echo ""
          echo "================================================================="
          echo "⚡ Powered by Redwanul Haque"
          echo "-----------------------------------------------------------------"
          echo "Android Web Emulator URL: ${ANDROID_URL}"
          echo "================================================================="
          echo ""

          m=350
          for i in $(seq 1 $m); do
            l=$((m - i))
            pct=$((i * 100 / m))
            echo "[$(date +'%H:%M:%S')] ⏱️ $l min remaining ($pct% elapsed)"
            sleep 60
          done

      # ───────────────────────────────────────────────
      # Step 6: Chain Rotation Engine
      # ───────────────────────────────────────────────
      - name: 🔁 Chain Rotation Engine
        if: ${{ !cancelled() }}
        run: |
          token="${{ secrets.GH_PAT }}"
          inputLoops="${{ github.event.inputs.loops }}"
          if [ -z "$inputLoops" ]; then
            loops=4
          else
            loops=$inputLoops
          fi

          if [ "$loops" -le 1 ]; then
            echo "🎯 Chain Finished Successfully. Total iterations completed."
            exit 0
          fi

          if [ -z "$token" ] || [ ${#token} -lt 10 ]; then
            echo "❌ GH_PAT secret is missing. Cannot dispatch next iteration."
            exit 1
          fi

          next=$((loops - 1))
          echo "🔁 Dispatching next iteration: $next remaining..."

          payload=$(jq -n \
            --arg ref "${{ github.ref_name }}" \
            --arg next "$next" \
            '{ref: $ref, inputs: {loops: $next}}')

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-web-emulator-slow.yml/dispatches" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Secured handoff executed to loop iteration: $next"
          else
            echo "⚠️ Chain dispatch returned HTTP status $http_code:"
            echo "$body"
            echo "💡 Tip: Make sure .github/workflows/android-web-emulator-slow.yml is committed and pushed to your GitHub repository's default branch."
          fi
