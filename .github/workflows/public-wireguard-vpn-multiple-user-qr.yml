name: Public WireGuard VPN (QR Code) - by Redwanul Haque
# Suggested filename: public-wireguard-vpn-multiple-user-qr.yml

on:
  workflow_dispatch:
    inputs:
      profiles_count:
        description: "👥 Number of unique profiles to generate (1 to 5)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      duration:
        description: "⏱️ Runtime in minutes (max 345)"
        required: false
        default: "340"
      loops:
        description: "🔄 Loop Counter (leave blank, auto-managed by the system)"
        required: false
        default: ""

concurrency:
  group: wireguard-qr-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  wireguard-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ───────────────────────────────────────────────
      # Step 1: Validate GitHub Token
      # ───────────────────────────────────────────────
      - name: 🔑 Validate GitHub Token
        id: validate
        run: |
          token="${{ secrets.GH_PAT }}"
          if [ -z "$token" ] || [ ${#token} -lt 10 ]; then
            echo "❌ GH_PAT secret is not set! Go to repo Settings > Secrets > Actions and add GH_PAT."
            exit 1
          fi
          echo "✅ GH_PAT secret is configured (${#token} chars)."

      # ───────────────────────────────────────────────
      # Step 2: System Information & Network Setup
      # ───────────────────────────────────────────────
      - name: 🧠 System Information
        run: |
          echo "=============================================="
          echo "🖥️ GitHub Actions Runner Specs"
          echo "CPU Cores : $(nproc)"
          echo "RAM       : $(free -h | awk '/^Mem:/ {print $2}')"
          echo "Disk Free : $(df -h / | awk 'NR==2 {print $4}')"
          echo "=============================================="

      # ───────────────────────────────────────────────
      # Step 3: Install Tools & Generate WireGuard Profiles
      # ───────────────────────────────────────────────
      - name: ⚙️ Generate Public WireGuard Profiles & QR Codes
        id: generate-wg
        run: |
          echo "📦 Installing WireGuard tools & qrencode..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools qrencode jq curl

          echo "⬇️ Downloading wgcf (Cloudflare WARP WireGuard Generator)..."
          token="${{ secrets.GH_PAT }}"
          WGCF_URL=$(curl -s ${token:+-H "Authorization: Bearer $token"} "https://api.github.com/repos/ViRb3/wgcf/releases/latest" | jq -r '.assets[]? | select(.name | test("linux_amd64$")) | .browser_download_url' | head -n 1)
          if [ -z "$WGCF_URL" ] || [ "$WGCF_URL" = "null" ]; then
            WGCF_URL="https://github.com/ViRb3/wgcf/releases/download/v2.2.26/wgcf_2.2.26_linux_amd64"
          fi
          echo "📥 Downloading wgcf from: $WGCF_URL"
          sudo curl -fsSL --retry 3 "$WGCF_URL" -o /usr/local/bin/wgcf
          sudo chmod +x /usr/local/bin/wgcf

          COUNT="${{ github.event.inputs.profiles_count || '1' }}"
          [[ ! "$COUNT" =~ ^[1-5]$ ]] && COUNT=1
          echo "PROFILES_COUNT=$COUNT" >> $GITHUB_ENV

          echo "🔐 Generating $COUNT unique Cloudflare WireGuard profiles..."
          mkdir -p /tmp/wg_profiles

          for i in $(seq 1 $COUNT); do
            echo "⚙️ Generating unique Profile #$i..."
            DIR="/tmp/wg_gen_$i"
            mkdir -p "$DIR"
            (
              cd "$DIR"
              wgcf register --accept-tos
              wgcf generate
            )
            if [ -f "$DIR/wgcf-profile.conf" ]; then
              cp "$DIR/wgcf-profile.conf" "/tmp/wg_profiles/wireguard_user_$i.conf"
              qrencode -o "/tmp/wg_profiles/wireguard_qr_$i.png" -s 10 -m 2 < "/tmp/wg_profiles/wireguard_user_$i.conf"
              echo "✅ Profile #$i generated successfully!"
            else
              echo "⚠️ Failed to generate Profile #$i"
            fi
            sleep 1
          done

      # ───────────────────────────────────────────────
      # Step 4: Summary of Generated Profiles
      # ───────────────────────────────────────────────
      - name: 📋 Profiles Summary
        run: |
          COUNT="${{ env.PROFILES_COUNT || '1' }}"
          echo "================================================================="
          echo "✅ $COUNT WireGuard Profiles Generated Successfully!"
          echo "📲 High-resolution QR Codes & .conf files are sent to Telegram."
          echo "================================================================="
          for i in $(seq 1 $COUNT); do
            CONF="/tmp/wg_profiles/wireguard_user_$i.conf"
            if [ -f "$CONF" ]; then
              echo "📄 Profile #$i: wireguard_user_$i.conf (Ready)"
            fi
          done
          echo "================================================================="

      # ───────────────────────────────────────────────
      # Step 5: Send All QR Codes & Configs to Telegram
      # ───────────────────────────────────────────────
      - name: 📲 Send QR Codes to Telegram
        run: |
          botToken="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          chatId="${{ secrets.TELEGRAM_CHAT_ID }}"

          if [ -z "$botToken" ] || [ -z "$chatId" ]; then
            echo "⚠️ Telegram secrets not set. Skipping Telegram delivery."
          else
            COUNT="${{ env.PROFILES_COUNT || '1' }}"
            for i in $(seq 1 $COUNT); do
              QR="/tmp/wg_profiles/wireguard_qr_$i.png"
              CONF="/tmp/wg_profiles/wireguard_user_$i.conf"

              if [ -f "$QR" ] && [ -f "$CONF" ]; then
                caption="🛡️ <b>Public WireGuard VPN — Profile #$i / $COUNT</b>"$'\n'
                caption+="━━━━━━━━━━━━━━━━━━━━"$'\n'
                caption+="👤 <b>Dedicated Profile for:</b> User #$i"$'\n'
                caption+="📱 <b>How to Connect:</b>"$'\n'
                caption+="1️⃣ Open official <b>WireGuard App</b> (iOS / Android)"$'\n'
                caption+="2️⃣ Tap <b>+</b> ➔ <b>Scan QR code</b>"$'\n'
                caption+="3️⃣ Scan this photo! 🚀"$'\n'
                caption+="━━━━━━━━━━━━━━━━━━━━"$'\n'
                caption+="💻 <b>PC / Mac:</b> Import the .conf file attached below"$'\n'
                caption+="⚡ <b>Speed:</b> Uncapped Gigabit Cloudflare Anycast"$'\n'
                caption+="⏱️ <b>Uptime:</b> ~5h 40m"$'\n'
                caption+="🔁 <b>Run:</b> #${{ github.run_number }}"$'\n'
                caption+="━━━━━━━━━━━━━━━━━━━━"$'\n'
                caption+="⚡ <i>Powered by Redwanul Haque</i>"

                echo "📤 Sending QR code #$i to Telegram..."
                curl -s --max-time 20 -X POST "https://api.telegram.org/bot${botToken}/sendPhoto" \
                  -F "chat_id=${chatId}" \
                  -F "photo=@${QR}" \
                  -F "caption=${caption}" \
                  -F "parse_mode=HTML" > /dev/null || true

                echo "📤 Sending .conf file #$i..."
                curl -s --max-time 20 -X POST "https://api.telegram.org/bot${botToken}/sendDocument" \
                  -F "chat_id=${chatId}" \
                  -F "document=@${CONF}" \
                  -F "caption=📄 WireGuard Profile #$i (.conf)" > /dev/null || true

                sleep 1
              fi
            done
            echo "✅ All $COUNT profiles delivered to Telegram!"
          fi

      # ───────────────────────────────────────────────
      # Step 6: Print Instructions & Keep Alive
      # ───────────────────────────────────────────────
      - name: 📢 Print Details & Keep Alive
        run: |
          echo ""
          echo "================================================================="
          echo "⚡ Powered by Redwanul Haque"
          echo "-----------------------------------------------------------------"
          echo "Status   : Multi-User Public WireGuard VPN Active"
          echo "Profiles : ${{ env.PROFILES_COUNT }} independent dedicated profiles"
          echo "Engine   : Cloudflare Anycast Edge WireGuard"
          echo "================================================================="
          echo ""

          m="${{ github.event.inputs.duration || '340' }}"
          [[ ! "$m" =~ ^[0-9]+$ ]] && m=340
          [ "$m" -gt 345 ] && m=345

          for i in $(seq 1 $m); do
            l=$((m - i))
            pct=$((i * 100 / m))
            echo "[$(date +'%H:%M:%S')] ⏱️ $l min remaining ($pct% elapsed)"
            sleep 60
          done

      # ───────────────────────────────────────────────
      # Step 7: Chain Rotation Engine
      # ───────────────────────────────────────────────
      - name: 🔁 Chain Rotation Engine
        if: ${{ !cancelled() }}
        run: |
          token="${{ secrets.GH_PAT }}"
          inputLoops="${{ github.event.inputs.loops }}"
          loops="${inputLoops:-4}"
          [[ ! "$loops" =~ ^[0-9]+$ ]] && loops=4

          if [ "$loops" -le 1 ]; then
            echo "🎯 Chain Finished Successfully. Total iterations completed."
            exit 0
          fi

          if [ -z "$token" ] || [ ${#token} -lt 10 ]; then
            echo "❌ GH_PAT secret is missing. Cannot dispatch next iteration."
            exit 1
          fi

          next=$((loops - 1))
          echo "🔁 Dispatching next iteration: $next remaining..."

          payload=$(jq -n \
            --arg ref "${{ github.ref_name }}" \
            --arg count "${{ env.PROFILES_COUNT || '1' }}" \
            --arg next "$next" \
            '{
              ref: $ref,
              inputs: {
                profiles_count: $count,
                loops: $next
              }
            }')

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/public-wireguard-vpn-multiple-user-qr.yml/dispatches" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Secured handoff executed to loop iteration: $next"
          else
            echo "⚠️ Chain dispatch returned HTTP status $http_code:"
            echo "$body"
            echo "💡 Tip: Make sure .github/workflows/public-wireguard-vpn-multiple-user-qr.yml is committed and pushed to your GitHub repository's default branch."
          fi
