name: V6 Tailscale Exit Node - Maximum Performance Lab

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to keep the exit node alive (minutes)"
        required: true
        default: "335"
        type: string
      loops:
        description: "Optional number of chain rotations (blank = continuous)"
        required: false
        default: ""
        type: string

concurrency:
  group: vpn-server-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TS_NODE: github-gigabit-vpn

    steps:
      - name: Validate secrets and inputs
        shell: bash
        run: |
          set -euo pipefail

          : "${GH_PAT:?GH_PAT secret is required}"
          : "${TAILSCALE_AUTH_KEY:?TAILSCALE_AUTH_KEY secret is required}"

          DURATION="${{ inputs.duration }}"
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "duration must be an integer"
            exit 1
          fi

          if (( DURATION < 1 || DURATION > 335 )); then
            echo "duration must be between 1 and 335 minutes"
            exit 1
          fi

      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail

          echo "===== RUNNER ====="
          uname -a
          cat /etc/os-release || true
          echo
          echo "CPU:"
          nproc
          lscpu | sed -n '1,25p' || true
          echo
          echo "MEMORY:"
          free -h
          echo
          echo "NETWORK:"
          ip -br addr
          ip route
          echo
          echo "DEFAULT INTERFACE:"
          ip route get 8.8.8.8

      - name: Detect network interface
        id: net
        shell: bash
        run: |
          set -euo pipefail

          IFACE="$(ip route get 8.8.8.8 | awk '
            {
              for (i=1; i<=NF; i++)
                if ($i == "dev") { print $(i+1); exit }
            }')"

          if [[ -z "$IFACE" ]]; then
            echo "Could not detect default network interface"
            exit 1
          fi

          echo "iface=$IFACE" >> "$GITHUB_OUTPUT"
          echo "Using interface: $IFACE"

      - name: Inspect NIC capabilities
        shell: bash
        run: |
          set -euo pipefail

          IFACE="${{ steps.net.outputs.iface }}"

          echo "===== ETHTOOL FEATURES ====="
          sudo ethtool -k "$IFACE" || true

          echo
          echo "===== ETHTOOL COALESCE ====="
          sudo ethtool -c "$IFACE" || true

          echo
          echo "===== ETHTOOL CHANNELS ====="
          sudo ethtool -l "$IFACE" || true

          echo
          echo "===== NIC DRIVER ====="
          sudo ethtool -i "$IFACE" || true

      - name: Baseline internet path
        shell: bash
        run: |
          set -euo pipefail

          echo "===== PUBLIC IP ====="
          curl --fail --silent --show-error --max-time 15 https://api.ipify.org || true
          echo

          echo "===== CLOUDFLARE HTTP LATENCY ====="
          curl --fail --silent --show-error \
            -o /dev/null \
            -w 'HTTP=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
            --max-time 20 \
            https://speed.cloudflare.com/ || true

      - name: Tune Linux networking
        shell: bash
        run: |
          set -euo pipefail

          echo "===== TCP CONGESTION ====="
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true

          echo "===== FORWARDING ====="
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          echo "===== SOCKET BUFFERS ====="
          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864
          sudo sysctl -w net.core.rmem_default=262144
          sudo sysctl -w net.core.wmem_default=262144
          sudo sysctl -w net.ipv4.tcp_rmem="4096 131072 67108864"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 16384 67108864"

          echo "===== NETWORK BACKLOG ====="
          sudo sysctl -w net.core.netdev_max_backlog=250000
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=8192

          echo "===== TCP BEHAVIOR ====="
          sudo sysctl -w net.ipv4.tcp_mtu_probing=1
          sudo sysctl -w net.ipv4.tcp_fastopen=3

          echo
          sysctl net.ipv4.tcp_congestion_control
          sysctl net.core.default_qdisc
          sysctl net.ipv4.ip_forward
          sysctl net.ipv6.conf.all.forwarding

      - name: Enable Tailscale Linux UDP forwarding offload
        shell: bash
        run: |
          set -euo pipefail

          IFACE="${{ steps.net.outputs.iface }}"

          # Recommended by Tailscale for Linux 6.2+ exit nodes/subnet routers.
          sudo ethtool -K "$IFACE" rx-udp-gro-forwarding on rx-gro-list off || true

          echo "===== RESULTING OFFLOAD SETTINGS ====="
          sudo ethtool -k "$IFACE" | grep -E \
            'rx-gro|rx-udp-gro-forwarding|rx-gro-list|tx-gro' || true

      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 \
            https://tailscale.com/install.sh | sh

          tailscale version

      - name: Start Tailscale exit node
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="$TS_NODE" \
            --advertise-exit-node \
            --accept-routes \
            --reset

          echo "===== TAILSCALE STATUS ====="
          tailscale status

          echo
          echo "===== TAILSCALE IP ====="
          tailscale ip -4

          echo
          echo "===== TAILSCALE PREFERENCES ====="
          tailscale debug prefs

      - name: Diagnose active Tailscale clients automatically
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "V6 AUTOMATIC CLIENT / PATH DIAGNOSTICS"
          echo "============================================================"

          TS_IP="$(tailscale ip -4)"
          echo "Exit node Tailscale IP: $TS_IP"
          echo

          echo "===== PEERS ====="
          tailscale status
          echo

          echo "===== AUTOMATIC PEER TESTS ====="

          # tailscale status --json gives us the current peer list.
          # We test only peers that are currently considered online.
          mapfile -t PEERS < <(
            tailscale status --json |
            python3 -c '
import json,sys
d=json.load(sys.stdin)
self_ip=d.get("Self",{}).get("TailscaleIPs",[])
for p in d.get("Peer",{}).values():
    ips=p.get("TailscaleIPs",[])
    online=p.get("Online",False)
    host=p.get("HostName") or p.get("DNSName") or "unknown"
    if online and ips:
        ip=ips[0]
        if ip not in self_ip:
            print(f"{ip}|{host}")
'
          )

          if (( ${#PEERS[@]} == 0 )); then
            echo "No online Tailscale peers detected."
          else
            for entry in "${PEERS[@]}"; do
              PEER_IP="${entry%%|*}"
              PEER_NAME="${entry#*|}"

              echo
              echo "------------------------------------------------------------"
              echo "Peer: $PEER_NAME"
              echo "IP:   $PEER_IP"
              echo "------------------------------------------------------------"

              # This reveals direct vs DERP vs peer-relay.
              tailscale ping --c 5 "$PEER_IP" || true
            done
          fi

          echo
          echo "===== IMPORTANT ====="
          echo "The Realme should appear above automatically if it is online."
          echo "A result containing 'via DERP(...)' means relay path."
          echo "A result containing an IP:41641 means direct UDP path."
          echo "This diagnostic does not assume which peer is using the exit node."

      - name: Check Tailscale network health
        shell: bash
        run: |
          set -euo pipefail

          echo "===== NETCHECK ====="
          tailscale netcheck

          echo
          echo "===== STATUS ====="
          tailscale status

          echo
          echo "===== IP ====="
          tailscale ip -4

          echo
          echo "===== PREFS ====="
          tailscale debug prefs

          # Fail closed if the node did not advertise an exit route.
          if ! tailscale debug prefs | grep -q '"0.0.0.0/0"'; then
            echo "Exit route was not advertised."
            exit 1
          fi

      - name: Notify Telegram
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets not configured; skipping."
            exit 0
          fi

          TS_IP="$(tailscale ip -4 2>/dev/null || echo unknown)"
          STATUS="$(tailscale status 2>/dev/null | head -25 || true)"

          MESSAGE="V6 Tailscale exit node ready
Node: $TS_NODE
Tailscale IP: $TS_IP
Duration: ${{ inputs.duration }} minutes

$STATUS"

          curl --fail --silent --show-error --retry 2 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            >/dev/null

      - name: Keep exit node alive
        shell: bash
        run: |
          set -euo pipefail

          DURATION="${{ inputs.duration }}"
          SECONDS_TOTAL=$((DURATION * 60))
          START="$(date +%s)"
          NEXT_REPORT=0

          echo "Keeping exit node alive for $DURATION minutes."

          while true; do
            NOW="$(date +%s)"
            ELAPSED=$((NOW - START))

            if (( ELAPSED >= SECONDS_TOTAL )); then
              break
            fi

            if (( ELAPSED >= NEXT_REPORT )); then
              echo
              echo "===== RUNTIME REPORT: ${ELAPSED}s ====="
              tailscale status || true
              tailscale netcheck || true

              IFACE="${{ steps.net.outputs.iface }}"
              echo
              echo "===== INTERFACE COUNTERS ====="
              ip -s link show "$IFACE" || true

              NEXT_REPORT=$((ELAPSED + 300))
            fi

            sleep 30
          done

      - name: Rotate workflow chain
        if: success()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          WORKFLOW="v6-tailscale-exit-node-maximum-performance-lab.yml"
          REF="${GITHUB_REF_NAME:-main}"

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "GH_PAT is missing."
            exit 1
          fi

          echo "Dispatching next V6 runner..."

          HTTP_CODE="$(
            curl --silent --show-error \
              --output /tmp/dispatch-response \
              --write-out '%{http_code}' \
              --fail-with-body \
              -X POST \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches" \
              -d "{\"ref\":\"${REF}\"}"
          )"

          echo "GitHub dispatch HTTP status: $HTTP_CODE"

      - name: Cleanup Tailscale
        if: always()
        shell: bash
        run: |
          set +e

          sudo tailscale logout
          sudo tailscale down

          echo "Tailscale cleanup completed."
