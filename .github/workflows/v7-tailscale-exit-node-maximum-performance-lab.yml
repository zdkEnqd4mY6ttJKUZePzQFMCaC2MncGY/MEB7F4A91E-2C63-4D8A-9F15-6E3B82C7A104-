name: V7 Tailscale Exit Node - Direct Path Performance Lab

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to keep the exit node alive (minutes)"
        required: true
        default: "335"
        type: string

      loops:
        description: "Optional number of chain rotations (blank = continuous)"
        required: false
        default: ""
        type: string

concurrency:
  group: vpn-server-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TS_NODE: github-gigabit-vpn

    steps:

      # ============================================================
      # VALIDATION
      # ============================================================

      - name: Validate secrets and inputs
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail

          : "${GH_PAT:?GH_PAT secret is required}"
          : "${TAILSCALE_AUTH_KEY:?TAILSCALE_AUTH_KEY secret is required}"

          DURATION="${{ inputs.duration }}"

          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "duration must be an integer"
            exit 1
          fi

          if (( DURATION < 1 || DURATION > 335 )); then
            echo "duration must be between 1 and 335 minutes"
            exit 1
          fi

          echo "Validation passed."

      # ============================================================
      # RUNNER INFORMATION
      # ============================================================

      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNER INFORMATION"
          echo "============================================================"

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "OS:"
          cat /etc/os-release || true

          echo
          echo "CPU:"
          nproc
          lscpu | sed -n '1,30p' || true

          echo
          echo "Memory:"
          free -h

          echo
          echo "Interfaces:"
          ip -br addr

          echo
          echo "Routes:"
          ip route

          echo
          echo "Default route:"
          ip route get 8.8.8.8

      # ============================================================
      # NETWORK INTERFACE
      # ============================================================

      - name: Detect network interface
        id: net
        shell: bash
        run: |
          set -euo pipefail

          IFACE="$(
            ip route get 8.8.8.8 |
            awk '
              {
                for (i = 1; i <= NF; i++) {
                  if ($i == "dev") {
                    print $(i + 1)
                    exit
                  }
                }
              }
            '
          )"

          if [[ -z "$IFACE" ]]; then
            echo "Could not detect default network interface."
            exit 1
          fi

          echo "iface=$IFACE" >> "$GITHUB_OUTPUT"

          echo "Default interface: $IFACE"

      # ============================================================
      # NIC CAPABILITIES
      # ============================================================

      - name: Inspect NIC
        shell: bash
        run: |
          set -euo pipefail

          IFACE="${{ steps.net.outputs.iface }}"

          echo "============================================================"
          echo "NIC DRIVER"
          echo "============================================================"

          sudo ethtool -i "$IFACE" || true

          echo
          echo "============================================================"
          echo "NIC FEATURES"
          echo "============================================================"

          sudo ethtool -k "$IFACE" || true

          echo
          echo "============================================================"
          echo "NIC CHANNELS"
          echo "============================================================"

          sudo ethtool -l "$IFACE" || true

          echo
          echo "============================================================"
          echo "NIC COALESCE"
          echo "============================================================"

          sudo ethtool -c "$IFACE" || true

      # ============================================================
      # INTERNET BASELINE
      # ============================================================

      - name: Baseline internet
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PUBLIC IP"
          echo "============================================================"

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            https://api.ipify.org

          echo

          echo
          echo "============================================================"
          echo "HTTP LATENCY"
          echo "============================================================"

          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out \
            'HTTP=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
            --max-time 20 \
            https://speed.cloudflare.com/ || true

      # ============================================================
      # LINUX NETWORK TUNING
      # ============================================================

      - name: Tune Linux networking
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "LINUX NETWORK TUNING"
          echo "============================================================"

          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.default_qdisc=fq || true

          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          sudo sysctl -w net.core.rmem_max=67108864
          sudo sysctl -w net.core.wmem_max=67108864

          sudo sysctl -w net.core.rmem_default=262144
          sudo sysctl -w net.core.wmem_default=262144

          sudo sysctl -w \
            net.ipv4.tcp_rmem="4096 131072 67108864"

          sudo sysctl -w \
            net.ipv4.tcp_wmem="4096 16384 67108864"

          sudo sysctl -w net.core.netdev_max_backlog=250000
          sudo sysctl -w net.ipv4.tcp_max_syn_backlog=8192

          sudo sysctl -w net.ipv4.tcp_mtu_probing=1
          sudo sysctl -w net.ipv4.tcp_fastopen=3

          echo
          echo "TCP congestion:"
          sysctl net.ipv4.tcp_congestion_control

          echo
          echo "Queue discipline:"
          sysctl net.core.default_qdisc

          echo
          echo "IPv4 forwarding:"
          sysctl net.ipv4.ip_forward

          echo
          echo "IPv6 forwarding:"
          sysctl net.ipv6.conf.all.forwarding

      # ============================================================
      # TAILSCALE UDP OFFLOAD
      # ============================================================

      - name: Configure Tailscale UDP forwarding offload
        shell: bash
        run: |
          set -euo pipefail

          IFACE="${{ steps.net.outputs.iface }}"

          echo "============================================================"
          echo "TAILSCALE UDP OFFLOAD"
          echo "============================================================"

          sudo ethtool -K \
            "$IFACE" \
            rx-udp-gro-forwarding on \
            rx-gro-list off || true

          echo
          sudo ethtool -k "$IFACE" |
            grep -E \
              'rx-gro|rx-udp-gro-forwarding|rx-gro-list|tx-gro' \
              || true

      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================

      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            https://tailscale.com/install.sh |
            sh

          echo
          echo "Tailscale version:"
          tailscale version

      # ============================================================
      # START EXIT NODE
      # ============================================================

      - name: Start Tailscale exit node
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "STARTING EXIT NODE"
          echo "============================================================"

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="$TS_NODE" \
            --advertise-exit-node \
            --accept-routes \
            --reset

          sleep 5

          echo
          echo "============================================================"
          echo "TAILSCALE STATUS"
          echo "============================================================"

          tailscale status

          echo
          echo "============================================================"
          echo "TAILSCALE IP"
          echo "============================================================"

          tailscale ip -4

          echo
          echo "============================================================"
          echo "TAILSCALE PREFERENCES"
          echo "============================================================"

          tailscale debug prefs

      # ============================================================
      # NAT / UDP DIAGNOSTICS
      # ============================================================

      - name: Diagnose runner NAT and UDP
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNER NAT / UDP DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "Local addresses:"
          ip -br addr

          echo
          echo "Default route:"
          ip route get 8.8.8.8

          echo
          echo "Public IPv4:"
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 15 \
            https://api.ipify.org

          echo

          echo
          echo "UDP sockets:"
          ss -u -a -n | head -100 || true

          echo
          echo "UDP 41641 listener:"
          ss -u -l -n -p |
            grep ':41641' ||
            echo "No local UDP 41641 listener shown."

          echo
          echo "TCP 41641:"
          ss -t -l -n -p |
            grep ':41641' ||
            echo "No TCP 41641 listener shown."

          echo
          echo "Tailscale netcheck:"
          tailscale netcheck

      # ============================================================
      # AUTOMATIC CLIENT DETECTION
      # ============================================================

      - name: Detect Realme and other online clients
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "AUTOMATIC TAILSCALE CLIENT DETECTION"
          echo "============================================================"

          TS_IP="$(tailscale ip -4)"

          echo
          echo "Exit node:"
          echo "$TS_NODE"

          echo
          echo "Exit node IP:"
          echo "$TS_IP"

          echo
          echo "============================================================"
          echo "TAILSCALE STATUS"
          echo "============================================================"

          tailscale status

          echo
          echo "============================================================"
          echo "ONLINE CLIENTS"
          echo "============================================================"

          mapfile -t PEERS < <(
            tailscale status --json |
              jq -r '
                .Peer
                | to_entries[]
                | select(.value.Online == true)
                | select(.value.TailscaleIPs != null)
                | [
                    .value.TailscaleIPs[0],
                    (.value.HostName // .value.DNSName // "unknown"),
                    (.value.OS // "unknown")
                  ]
                | @tsv
              '
          )

          if (( ${#PEERS[@]} == 0 )); then
            echo "No online peers found."
            exit 0
          fi

          for entry in "${PEERS[@]}"; do

            PEER_IP="$(echo "$entry" | cut -f1)"
            PEER_NAME="$(echo "$entry" | cut -f2)"
            PEER_OS="$(echo "$entry" | cut -f3)"

            if [[ "$PEER_IP" == "$TS_IP" ]]; then
              continue
            fi

            echo
            echo "------------------------------------------------------------"
            echo "CLIENT"
            echo "Name: $PEER_NAME"
            echo "IP:   $PEER_IP"
            echo "OS:   $PEER_OS"
            echo "------------------------------------------------------------"

            echo
            echo "Initial path test:"

            tailscale ping \
              --c 5 \
              "$PEER_IP" || true

          done

      # ============================================================
      # REALME-SPECIFIC DIAGNOSTIC
      # ============================================================

      - name: Test Realme direct path
        shell: bash
        run: |
          set -euo pipefail

          REALME_IP="100.96.102.83"

          echo "============================================================"
          echo "REALME GT MASTER EDITION"
          echo "============================================================"

          echo
          echo "Target:"
          echo "$REALME_IP"

          echo
          echo "Current status:"
          tailscale status |
            grep -E \
              '100\.96\.102\.83|realme-gt-master-edition' ||
              echo "Realme not currently shown as online."

          echo
          echo "============================================================"
          echo "PING TEST"
          echo "============================================================"

          tailscale ping \
            --c 10 \
            "$REALME_IP" || true

          echo
          echo "============================================================"
          echo "SECOND PATH TEST"
          echo "============================================================"

          sleep 2

          tailscale ping \
            --c 10 \
            "$REALME_IP" || true

          echo
          echo "============================================================"
          echo "CURRENT STATUS AFTER TEST"
          echo "============================================================"

          tailscale status |
            grep -E \
              '100\.96\.102\.83|realme-gt-master-edition' ||
              true

      # ============================================================
      # TAILSCALE HEALTH
      # ============================================================

      - name: Verify exit node health
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "TAILSCALE NETCHECK"
          echo "============================================================"

          tailscale netcheck

          echo
          echo "============================================================"
          echo "TAILSCALE STATUS"
          echo "============================================================"

          tailscale status

          echo
          echo "============================================================"
          echo "TAILSCALE PREFERENCES"
          echo "============================================================"

          PREFS="$(tailscale debug prefs)"

          echo "$PREFS"

          if ! echo "$PREFS" | grep -q '"0.0.0.0/0"'; then
            echo
            echo "ERROR: Exit route was not advertised."
            exit 1
          fi

      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: Notify Telegram
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ||
                -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets not configured; skipping."
            exit 0
          fi

          TS_IP="$(
            tailscale ip -4 2>/dev/null ||
            echo "unknown"
          )"

          STATUS="$(
            tailscale status 2>/dev/null |
            head -25 ||
            true
          )"

          MESSAGE="V7 Tailscale exit node ready
          Node: $TS_NODE
          Tailscale IP: $TS_IP
          Duration: ${{ inputs.duration }} minutes

          $STATUS"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            >/dev/null

      # ============================================================
      # KEEP ALIVE + LIVE PATH MONITOR
      # ============================================================

      - name: Keep exit node alive and monitor path
        shell: bash
        run: |
          set -euo pipefail

          DURATION="${{ inputs.duration }}"
          SECONDS_TOTAL=$((DURATION * 60))

          START="$(date +%s)"
          NEXT_REPORT=0

          REALME_IP="100.96.102.83"
          IFACE="${{ steps.net.outputs.iface }}"

          echo "============================================================"
          echo "EXIT NODE ACTIVE"
          echo "============================================================"

          echo
          echo "Duration: $DURATION minutes"

          while true; do

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START))

            if (( ELAPSED >= SECONDS_TOTAL )); then
              break
            fi

            if (( ELAPSED >= NEXT_REPORT )); then

              echo
              echo "============================================================"
              echo "RUNTIME REPORT"
              echo "Elapsed: ${ELAPSED}s"
              echo "============================================================"

              echo
              echo "Tailscale status:"
              tailscale status || true

              echo
              echo "Realme path:"
              tailscale ping \
                --c 3 \
                "$REALME_IP" || true

              echo
              echo "Netcheck:"
              tailscale netcheck || true

              echo
              echo "Interface counters:"
              ip -s link show "$IFACE" || true

              echo
              echo "UDP sockets:"
              ss -u -a -n | head -50 || true

              NEXT_REPORT=$((ELAPSED + 300))
            fi

            sleep 30

          done

      # ============================================================
      # ROTATE WORKFLOW
      # ============================================================

      - name: Rotate workflow chain
        if: success()
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "GH_PAT is not configured."
            echo "Skipping workflow rotation."
            exit 0
          fi

          REPO="${GITHUB_REPOSITORY}"
          WORKFLOW="v7-tailscale-exit-node-direct-path-performance-lab.yml"
          REF="${GITHUB_REF_NAME:-main}"

          echo "============================================================"
          echo "DISPATCHING NEXT V7 RUNNER"
          echo "============================================================"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/dispatch-response \
              --write-out '%{http_code}' \
              --fail-with-body \
              -X POST \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches" \
              -d "{\"ref\":\"${REF}\"}"
          )"

          echo "GitHub dispatch HTTP status: $HTTP_CODE"

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup Tailscale
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "TAILSCALE CLEANUP"
          echo "============================================================"

          sudo tailscale logout
          sudo tailscale down

          echo "Cleanup completed."
